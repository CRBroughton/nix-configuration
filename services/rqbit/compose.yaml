# Media stack - torrent download (PIA killswitch), *arr automation, Jellyfin.
# Run with: podman compose up -d
#
# Network topology: gluetun owns the network namespace and holds the PIA
# tunnel + killswitch firewall. qbittorrent and tailscale-qbittorrent join
# that namespace via network_mode: service:gluetun, so qbittorrent has no
# route to the internet other than through the VPN tunnel - if the tunnel
# drops, gluetun's firewall blocks all traffic (including qbittorrent's)
# until it's back up.
#
# Storage layout: /mnt/nvme-storage/media/{movies,tv} - sonarr/radarr manage
# this automatically; for manual adds in qbittorrent, set save path to
# /downloads/movies or /downloads/tv so Jellyfin picks it up correctly.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-rqbit
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      - SERVER_REGIONS=${PIA_SERVER_REGIONS:-UK London}
      - FIREWALL=on
      - FIREWALL_OUTBOUND_SUBNETS=100.64.0.0/10
    volumes:
      - ./gluetun:/gluetun
    ports:
      # qbittorrent's WebUI, so sonarr/radarr (outside gluetun's netns) can
      # reach it as a download client via host.containers.internal:8090.
      # Bound to 0.0.0.0 rather than 127.0.0.1 because rootless podman's NAT
      # (pasta/slirp4netns) doesn't present as true loopback traffic - not
      # exposed externally since this port isn't in the host firewall's
      # allowed list.
      - 8090:8090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Tailscale sidecar for gluetun's netns - exposes qbittorrent's WebUI (see
  # serve.json: plain TCP forward on 8090, no HTTPS termination needed).
  tailscale-qbittorrent:
    image: tailscale/tailscale:latest
    container_name: tailscale-qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-qbittorrent:/var/lib/tailscale:Z
      - ./serve.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  # qBittorrent - download client for sonarr/radarr. Same PIA killswitch
  # protection - joins gluetun's netns instead of getting its own.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8090
    volumes:
      - qbittorrent-config:/config
      - /mnt/nvme-storage/media:/downloads

  # Jellyfin - media frontend for downloaded files. Not routed through PIA;
  # it only needs to serve the already-downloaded files over Tailscale, so it
  # gets its own network namespace (own tailscale sidecar) instead of joining
  # gluetun's.
  tailscale-jellyfin:
    image: tailscale/tailscale:latest
    container_name: tailscale-jellyfin
    hostname: jellyfin
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-jellyfin:/var/lib/tailscale:Z
      - ./serve-jellyfin.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: service:tailscale-jellyfin
    depends_on:
      - tailscale-jellyfin
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /mnt/nvme-storage/media/movies:/data/movies:ro
      - /mnt/nvme-storage/media/tv:/data/tv:ro

  # Prowlarr - indexer manager, feeds search results to sonarr/radarr.
  # Not routed through PIA - only rqbit's actual downloads need the tunnel.
  tailscale-prowlarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-prowlarr
    hostname: prowlarr
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-prowlarr:/var/lib/tailscale:Z
      - ./serve-prowlarr.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:tailscale-prowlarr
    depends_on:
      - tailscale-prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr-config:/config

  # Sonarr - TV show fetching/organizing, talks to rqbit as its download
  # client (via host.containers.internal:3030, since rqbit lives inside
  # gluetun's netns) and prowlarr for indexers.
  tailscale-sonarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-sonarr
    hostname: sonarr
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-sonarr:/var/lib/tailscale:Z
      - ./serve-sonarr.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    network_mode: service:tailscale-sonarr
    depends_on:
      - tailscale-sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - sonarr-config:/config
      - /mnt/nvme-storage/media:/data

  # Radarr - same as sonarr, for movies.
  tailscale-radarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-radarr
    hostname: radarr
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-radarr:/var/lib/tailscale:Z
      - ./serve-radarr.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    network_mode: service:tailscale-radarr
    depends_on:
      - tailscale-radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - radarr-config:/config
      - /mnt/nvme-storage/media:/data

volumes:
  qbittorrent-config:
  jellyfin-config:
  jellyfin-cache:
  prowlarr-config:
  sonarr-config:
  radarr-config:
