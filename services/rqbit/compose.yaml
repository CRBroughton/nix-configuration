# rqbit - Torrent client, routed exclusively through PIA (gluetun)
# Run with: podman compose up -d
#
# Network topology: gluetun owns the network namespace and holds the PIA
# tunnel + killswitch firewall. Both tailscale-rqbit and rqbit join that
# namespace via network_mode: service:gluetun, so rqbit has no route to
# the internet other than through the VPN tunnel - if the tunnel drops,
# gluetun's firewall blocks all traffic (including rqbit's) until it's
# back up.
#
# Storage layout: /mnt/nvme-storage/media/{movies,tv} - when adding a
# torrent in rqbit, set its output folder to movies/ or tv/ so Jellyfin
# picks it up as the right library type.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-rqbit
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      - SERVER_REGIONS=${PIA_SERVER_REGIONS:-UK London}
      - FIREWALL=on
      - FIREWALL_OUTBOUND_SUBNETS=100.64.0.0/10
    volumes:
      - ./gluetun:/gluetun
    ports:
      # rqbit's API and qbittorrent's WebUI, published to localhost only so
      # sonarr/radarr (outside gluetun's netns) can reach them as download
      # clients via host.containers.internal:<port>
      - 127.0.0.1:3030:3030
      - 127.0.0.1:8090:8090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  tailscale-rqbit:
    image: tailscale/tailscale:latest
    container_name: tailscale-rqbit
    hostname: rqbit
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale:/var/lib/tailscale:Z
      - ./serve.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  rqbit:
    image: ikatson/rqbit:latest
    container_name: rqbit
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    command: >
      --http-api-listen-addr 0.0.0.0:3030
      server start
      /downloads
    volumes:
      - /mnt/nvme-storage/media:/downloads
      - rqbit-config:/home/rqbit

  # qBittorrent - download client for sonarr/radarr (rqbit isn't supported by
  # the stable Sonarr/Radarr releases yet). Same PIA killswitch protection as
  # rqbit - joins gluetun's netns instead of getting its own.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8090
    volumes:
      - qbittorrent-config:/config
      - /mnt/nvme-storage/media:/downloads

  # Jellyfin - media frontend for downloaded files. Not routed through PIA;
  # it only needs to serve the already-downloaded files over Tailscale, so it
  # gets its own network namespace (own tailscale sidecar) instead of joining
  # gluetun's.
  tailscale-jellyfin:
    image: tailscale/tailscale:latest
    container_name: tailscale-jellyfin
    hostname: jellyfin
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-jellyfin:/var/lib/tailscale:Z
      - ./serve-jellyfin.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: service:tailscale-jellyfin
    depends_on:
      - tailscale-jellyfin
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /mnt/nvme-storage/media/movies:/data/movies:ro
      - /mnt/nvme-storage/media/tv:/data/tv:ro

  # Prowlarr - indexer manager, feeds search results to sonarr/radarr.
  # Not routed through PIA - only rqbit's actual downloads need the tunnel.
  tailscale-prowlarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-prowlarr
    hostname: prowlarr
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-prowlarr:/var/lib/tailscale:Z
      - ./serve-prowlarr.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:tailscale-prowlarr
    depends_on:
      - tailscale-prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr-config:/config

  # Sonarr - TV show fetching/organizing, talks to rqbit as its download
  # client (via host.containers.internal:3030, since rqbit lives inside
  # gluetun's netns) and prowlarr for indexers.
  tailscale-sonarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-sonarr
    hostname: sonarr
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-sonarr:/var/lib/tailscale:Z
      - ./serve-sonarr.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    network_mode: service:tailscale-sonarr
    depends_on:
      - tailscale-sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - sonarr-config:/config
      - /mnt/nvme-storage/media:/data

  # Radarr - same as sonarr, for movies.
  tailscale-radarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-radarr
    hostname: radarr
    restart: unless-stopped
    env_file:
      - /run/agenix/ts_authkey
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-radarr:/var/lib/tailscale:Z
      - ./serve-radarr.json:/config/serve.json:ro,Z
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    network_mode: service:tailscale-radarr
    depends_on:
      - tailscale-radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - radarr-config:/config
      - /mnt/nvme-storage/media:/data

volumes:
  rqbit-config:
  qbittorrent-config:
  jellyfin-config:
  jellyfin-cache:
  prowlarr-config:
  sonarr-config:
  radarr-config:
